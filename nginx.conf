server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno do Docker (EasyPanel) — resolve o serviço marketing-api em runtime,
  # p/ o nginx não falhar no boot se o container ainda não subiu.
  resolver 127.0.0.11 valid=10s;

  # ── Módulo MARKETING · reverse-proxy MESMA ORIGEM ──────────────────────────
  # O front nativo do Marketing chama /mkt-api/... → este proxy encaminha ao
  # container `marketing-api` (3º serviço do projeto portal-cliente, banco
  # `marketing` separado). Sem iframe, sem CORS, sem domínio novo. O `/mkt-api/`
  # é removido antes de repassar (marketing-api tem prefixo global /api).
  # ⚠️ confirmar o nome interno do serviço no EasyPanel (marketing-api) no deploy.
  location /mkt-api/ {
    set $mkt_upstream http://marketing-api:3030;
    rewrite ^/mkt-api/(.*)$ /$1 break;
    proxy_pass $mkt_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Logo, imagem de referência e documento sobem em base64 (que infla ~33%).
    # Sem isto o nginx corta em 1MB (padrão) e devolve 413 ANTES da API — que
    # aceita 50MB. Deixamos os dois lados coerentes.
    client_max_body_size 50m;
    client_body_timeout 300s;
    proxy_read_timeout 300s;   # a leitura de site/PDF pela IA leva minutos
    proxy_send_timeout 300s;
  }

  # SPA fallback — todas as rotas caem no index.html (React Router).
  # index.html NUNCA em cache: ele aponta pro bundle com hash. Se o navegador
  # segurar um index.html velho, o usuário fica preso num bundle antigo — e um
  # deploy que muda API/segurança quebra pra quem tem cache. Sempre revalidar.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # cache de assets com hash
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
